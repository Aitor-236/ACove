# ============================================================
# ACove 服务器部署编排：MySQL + 后端 + 前端(Nginx)
# 用法（在仓库根目录）：
#   cp .env.example .env   # 或 ./deploy.sh init 自动生成随机密钥
#   docker compose up -d --build
#   浏览器访问 http://<服务器IP>/       后台 http://<服务器IP>/login
# 更省事的方式是直接用仓库根的 ./deploy.sh（见该脚本的帮助）。
# ============================================================
name: acove

services:
  # ---------- MySQL 8.4 ----------
  mysql:
    image: mysql:8.4
    container_name: acove-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${BLOG_DB_NAME:-blog_db}
      TZ: Asia/Shanghai
    volumes:
      # 数据持久化：删除容器不丢数据，重建容器也不会重新初始化
      - mysql-data:/var/lib/mysql
      # 建表不在这里做：MySQL 只负责建出 MYSQL_DATABASE 指定的空库，
      # 之后的表结构全部由后端启动时的 Flyway 执行 db/migration 里的迁移脚本。
      # 固定客户端字符集为 utf8mb4，否则容器 locale 是 POSIX、客户端退回 latin1，
      # 账号脚本 / 手工执行 SQL 时的中文（分类名、列注释）会被写成乱码
      - ./docker/mysql-client.cnf:/etc/mysql/conf.d/zz-client-charset.cnf:ro
    ports:
      # 只绑定回环地址，给服务器本机的客户端 / 隧道用，不对公网开放
      - "${BLOG_DB_BIND:-127.0.0.1}:${BLOG_DB_PORT:-13306}:3306"
    healthcheck:
      # 必须用 TCP：初始化阶段 MySQL 只监听 socket，避免后端在初始化完成前启动
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - blog-net

  # ---------- Spring Boot 后端 ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: acove-backend:${BLOG_IMAGE_TAG:-latest}
    container_name: acove-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 激活 backend/src/main/resources/application-docker.yml
      SPRING_PROFILES_ACTIVE: docker
      BLOG_DB_URL: "jdbc:mysql://mysql:3306/${BLOG_DB_NAME:-blog_db}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      BLOG_DB_USER: ${BLOG_DB_USER:-root}
      BLOG_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      BLOG_JWT_SECRET: ${BLOG_JWT_SECRET:?请在 .env 中设置 BLOG_JWT_SECRET}
      BLOG_JWT_EXPIRE_TIME: ${BLOG_JWT_EXPIRE_TIME:-86400000}
      BLOG_UPLOAD_DIR: /app/uploads
      JAVA_OPTS: "${JAVA_OPTS:--XX:MaxRAMPercentage=75 -Duser.timezone=Asia/Shanghai}"
      TZ: Asia/Shanghai
    volumes:
      # 头像与正文配图必须持久化，否则重建容器后图片全丢
      - uploads-data:/app/uploads
    healthcheck:
      # 镜像里没有 curl/wget，用 bash 的 /dev/tcp 探一下端口
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - blog-net

  # ---------- Nginx 前端 + API 反向代理 ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: acove-frontend:${BLOG_IMAGE_TAG:-latest}
    container_name: acove-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: Asia/Shanghai
      # 站点主域名：前端 nginx 模板（nginx.conf.template）用它做 server_name、
      # HTTPS 跳转目标和证书路径，换域名只改 .env 的 SITE_DOMAIN 即可
      SITE_DOMAIN: ${SITE_DOMAIN:-acove.top}
    ports:
      # 对外端口；80 / 443 被占用时在 .env 里改 BLOG_HTTP_PORT / BLOG_HTTPS_PORT
      - "${BLOG_HTTP_PORT:-80}:80"
      - "${BLOG_HTTPS_PORT:-443}:443"
    volumes:
      # certbot 的 HTTP-01 校验目录：宿主签发/续期时把校验文件写在这里，
      # 容器只读挂载后由 nginx 的 /.well-known/acme-challenge/ 直接返回
      - /var/www/certbot:/var/www/certbot:ro
      # 证书目录：certbot 在宿主签发/续期，容器只读挂载后由 nginx 读取。
      # 注意：证书不存在时 nginx 起不来，首次部署请按 README「域名与 HTTPS」先签发证书。
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      # 用 /healthz 而不是 /：后者将来会 301 到 HTTPS，证书域名与 127.0.0.1 不匹配会误判
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - blog-net

volumes:
  mysql-data:
  uploads-data:

networks:
  blog-net:
    driver: bridge
