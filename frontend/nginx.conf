# ============================================================
# Aitor Blog 前端容器内的 Nginx 配置
#   - 托管 Vue 构建产物（history 模式，找不到文件回退 index.html）
#   - /api/** 反代到后端容器，并去掉 /api 前缀（和 vite dev 代理保持一致）
#   - /.well-known/acme-challenge/** 交给宿主 certbot 做 HTTP-01 校验
#     （宿主 /var/www/certbot 只读挂载到容器同路径，见 README「HTTPS」一节）
# ============================================================
server {
    listen       80 default_server;
    server_name  aitor.top www.aitor.top _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # certbot 续期/签发的校验文件落在这里，nginx 直接原样返回
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
        access_log   off;
    }

    # 容器健康检查专用探针：走 HTTP、不落访问日志，将来开了 443 也不会被跳转影响
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 上传接口单文件上限 5MB（后端 spring.servlet.multipart 同值），留一点余量
    client_max_body_size 8m;

    # 静态资源压缩
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1k;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml text/javascript image/svg+xml;

    # 带内容 hash 的构建产物可以长期缓存
    location /assets/ {
        expires    30d;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html 不缓存，保证发版后立刻拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 前端 axios 的 baseURL 是 /api，这里去掉前缀转发给后端
    # 例：/api/uploads/avatar/x.png -> http://backend:8080/uploads/avatar/x.png
    location /api/ {
        # 用 Docker 内置 DNS：后端容器单独重建后 IP 会变，
        # 写死 proxy_pass http://backend:8080/ 会缓存旧 IP 导致 /api 一直 502，
        # 这里让它每 10 秒重新解析一次。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;

        # 去掉 /api 前缀：/api/article/list?page=1 -> /article/list?page=1
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA 回退：/articles/1、/admin/xxx 这类地址直接刷新也能打开
    location / {
        try_files $uri $uri/ /index.html;
    }
}
